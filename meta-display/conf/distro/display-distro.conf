
require conf/distro/poky.conf

DISTRO_NAME = "display-distro"
DISTOR_VERSION = "1.0"
DISTROOVERRIDES = "poky"

DISTRO_FEATURES:append = " bluetooth"
DISTRO_FEATURES:append = " keyboard"
DISTRO_FEATURES:append = " opengl"
DISTRO_FEATURES:append = " screen"
DISTRO_FEATURES:append = " usbhost"
DISTRO_FEATURES:append = " wifi"
DISTRO_FEATURES:append = " x11"

DISTRO_FEATURES:append = " systemd"
DISTRO_FEATURES:append = " usrmerge"

# removes traces of sysvinit, seemed to cause an issue with NetworkManager
# I suspect it may have been starting it, then when systemd started it, it failed since it was
# already running
DISTRO_FEATURES:remove = " sysvinit"

VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"
